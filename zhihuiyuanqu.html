<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧园区综合管理平台</title>
  <style>
    :root {
      --bg-deep: #020b1a;
      --bg-panel: rgba(8, 28, 58, 0.72);
      --border: rgba(64, 168, 255, 0.35);
      --border-bright: rgba(90, 200, 255, 0.65);
      --cyan: #3ecbff;
      --cyan-soft: #7adfff;
      --text: #e8f4ff;
      --text-dim: #8eb6d8;
      --green: #2dff9a;
      --orange: #ffb020;
      --red: #ff5c6c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg-deep);
    }

    body {
      position: relative;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(30, 90, 180, 0.45), transparent 55%),
        radial-gradient(ellipse 40% 40% at 10% 80%, rgba(20, 80, 160, 0.25), transparent 50%),
        radial-gradient(ellipse 40% 40% at 90% 70%, rgba(0, 120, 180, 0.2), transparent 50%),
        linear-gradient(180deg, #031330 0%, #020b1a 45%, #01101f 100%);
    }

    /* 网格背景 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(50, 140, 220, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50, 140, 220, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 75%);
      pointer-events: none;
    }

    .screen {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 18px 28px 22px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    /* ===== 顶部标题 ===== */
    .header {
      position: relative;
      text-align: center;
      padding: 10px 0 18px;
    }

    .header::before,
    .header::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 38%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan));
    }

    .header::before { left: 0; }
    .header::after {
      right: 0;
      background: linear-gradient(90deg, var(--cyan), transparent);
    }

    .header-deco {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 10px;
      background:
        linear-gradient(135deg, transparent 40%, var(--cyan) 41%, var(--cyan) 59%, transparent 60%),
        linear-gradient(-135deg, transparent 40%, var(--cyan) 41%, var(--cyan) 59%, transparent 60%);
      background-size: 50% 100%;
      background-position: left, right;
      background-repeat: no-repeat;
      opacity: 0.85;
    }

    .header h1 {
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 700;
      letter-spacing: 0.18em;
      background: linear-gradient(180deg, #ffffff 20%, var(--cyan-soft) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(62, 203, 255, 0.25);
    }

    .header-sub {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 0.35em;
      color: var(--text-dim);
    }

    .clock {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--cyan-soft);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }

    /* ===== 主体三栏 ===== */
    .main {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      gap: 16px;
      min-height: 0;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      position: relative;
      backdrop-filter: blur(8px);
      box-shadow:
        inset 0 0 30px rgba(30, 100, 180, 0.08),
        0 8px 32px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    /* 四角装饰 */
    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--cyan);
      border-style: solid;
      pointer-events: none;
      z-index: 2;
    }

    .panel::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .panel::after {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
    }

    .corner-bl,
    .corner-br {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--cyan);
      border-style: solid;
      pointer-events: none;
      z-index: 2;
    }

    .corner-bl {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
    }

    .corner-br {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--cyan-soft);
      border-bottom: 1px solid rgba(64, 168, 255, 0.2);
      background: linear-gradient(90deg, rgba(30, 100, 180, 0.25), transparent);
    }

    .panel-title::before {
      content: "";
      width: 3px;
      height: 14px;
      background: var(--cyan);
      border-radius: 1px;
      box-shadow: 0 0 8px var(--cyan);
    }

    .panel-body {
      padding: 14px 16px;
      height: calc(100% - 45px);
      overflow: auto;
    }

    /* ===== 左侧摄像头 ===== */
    .camera-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .camera-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      background: rgba(4, 20, 45, 0.65);
      border: 1px solid rgba(64, 168, 255, 0.2);
      border-radius: 4px;
      transition: border-color 0.25s, background 0.25s;
      cursor: default;
    }

    .camera-item:hover {
      border-color: var(--border-bright);
      background: rgba(10, 40, 80, 0.7);
    }

    .camera-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: linear-gradient(145deg, rgba(40, 120, 200, 0.4), rgba(10, 40, 80, 0.6));
      border: 1px solid rgba(90, 200, 255, 0.3);
      color: var(--cyan);
    }

    .camera-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .camera-info {
      flex: 1;
      min-width: 0;
    }

    .camera-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .camera-meta {
      font-size: 11px;
      color: var(--text-dim);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--green);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    /* ===== 中间监控画面 ===== */
    .monitor {
      display: flex;
      flex-direction: column;
    }

    .monitor .panel-body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .viewport {
      width: 100%;
      height: 100%;
      min-height: 280px;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.03) 2px,
          rgba(0, 0, 0, 0.03) 4px
        ),
        linear-gradient(160deg, #3a4555 0%, #2a3340 40%, #1e2630 100%);
      border: 1px solid rgba(120, 140, 160, 0.4);
      border-radius: 2px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.45);
    }

    .viewport::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(62, 203, 255, 0.04) 50%,
        transparent 100%
      );
      background-size: 100% 200%;
      animation: scan 4s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { background-position: 0 -100%; }
      100% { background-position: 0 100%; }
    }

    .viewport-label {
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 600;
      letter-spacing: 0.3em;
      color: rgba(200, 210, 220, 0.75);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
    }

    .viewport-hint {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(150, 170, 190, 0.6);
      position: relative;
      z-index: 1;
    }

    .rec-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #ff8a8a;
      z-index: 1;
    }

    .rec-badge span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff4040;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .cam-tag {
      position: absolute;
      bottom: 14px;
      left: 14px;
      font-size: 12px;
      color: rgba(180, 200, 220, 0.8);
      letter-spacing: 0.08em;
      z-index: 1;
    }

    /* ===== 右侧报警 ===== */
    .alarm-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alarm-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: rgba(4, 20, 45, 0.65);
      border: 1px solid rgba(64, 168, 255, 0.18);
      border-left: 3px solid var(--orange);
      border-radius: 0 4px 4px 0;
      animation: fadeIn 0.6s ease both;
    }

    .alarm-item:nth-child(2) {
      border-left-color: var(--red);
      animation-delay: 0.15s;
    }

    .alarm-item:nth-child(3) {
      border-left-color: var(--cyan);
      animation-delay: 0.3s;
    }

    .alarm-item:nth-child(4) {
      animation-delay: 0.45s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .alarm-time {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
      font-variant-numeric: tabular-nums;
      padding-top: 1px;
    }

    .alarm-content {
      flex: 1;
      min-width: 0;
    }

    .alarm-text {
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 4px;
    }

    .alarm-tag {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(255, 176, 32, 0.15);
      color: var(--orange);
      border: 1px solid rgba(255, 176, 32, 0.3);
    }

    .alarm-item:nth-child(2) .alarm-tag {
      background: rgba(255, 92, 108, 0.15);
      color: var(--red);
      border-color: rgba(255, 92, 108, 0.3);
    }

    /* ===== 底部数字卡片 ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
    }

    .stat-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
    }

    .stat-card:nth-child(1)::before { background: var(--orange); box-shadow: 0 0 12px var(--orange); }
    .stat-card:nth-child(2)::before { background: var(--green); box-shadow: 0 0 12px var(--green); }
    .stat-card:nth-child(3)::before { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

    .stat-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .stat-card:nth-child(1) .stat-icon {
      background: rgba(255, 176, 32, 0.12);
      color: var(--orange);
      border: 1px solid rgba(255, 176, 32, 0.3);
    }

    .stat-card:nth-child(2) .stat-icon {
      background: rgba(45, 255, 154, 0.1);
      color: var(--green);
      border: 1px solid rgba(45, 255, 154, 0.3);
    }

    .stat-card:nth-child(3) .stat-icon {
      background: rgba(62, 203, 255, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(62, 203, 255, 0.3);
    }

    .stat-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: clamp(22px, 2.2vw, 30px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .stat-card:nth-child(1) .stat-value { color: var(--orange); }
    .stat-card:nth-child(2) .stat-value { color: var(--green); }
    .stat-card:nth-child(3) .stat-value { color: var(--cyan); }

    .stat-unit {
      font-size: 14px;
      font-weight: 500;
      margin-left: 2px;
      opacity: 0.85;
    }

    /* 响应式 */
    @media (max-width: 960px) {
      body { overflow: auto; }
      .screen {
        height: auto;
        min-height: 100%;
        overflow: visible;
      }
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 320px auto;
      }
      .clock { display: none; }
      .header h1 { letter-spacing: 0.08em; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- 顶部 -->
    <header class="header">
      <h1>智慧园区综合管理平台</h1>
      <p class="header-sub">SMART CAMPUS SECURITY PLATFORM</p>
      <div class="header-deco"></div>
      <div class="clock" id="clock">--:--:--</div>
    </header>

    <!-- 主体 -->
    <div class="main">
      <!-- 左侧摄像头 -->
      <aside class="panel">
        <div class="corner-bl"></div>
        <div class="corner-br"></div>
        <div class="panel-title">监控设备</div>
        <div class="panel-body">
          <div class="camera-list">
            <div class="camera-item">
              <div class="camera-icon">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
              </div>
              <div class="camera-info">
                <div class="camera-name">大门摄像头</div>
                <div class="camera-meta">CAM-01 · 入口A区</div>
              </div>
              <div class="status"><span class="status-dot"></span>在线</div>
            </div>
            <div class="camera-item">
              <div class="camera-icon">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
              </div>
              <div class="camera-info">
                <div class="camera-name">停车场摄像头</div>
                <div class="camera-meta">CAM-07 · 地下B2</div>
              </div>
              <div class="status"><span class="status-dot"></span>在线</div>
            </div>
            <div class="camera-item">
              <div class="camera-icon">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
              </div>
              <div class="camera-info">
                <div class="camera-name">楼宇周界</div>
                <div class="camera-meta">CAM-12 · 东侧围墙</div>
              </div>
              <div class="status"><span class="status-dot"></span>在线</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 中间画面 -->
      <section class="panel monitor">
        <div class="corner-bl"></div>
        <div class="corner-br"></div>
        <div class="panel-title">视频预览</div>
        <div class="panel-body">
          <div class="viewport">
            <div class="rec-badge"><span></span>REC</div>
            <div class="viewport-label">实时监控画面</div>
            <div class="viewport-hint">LIVE STREAM · 1920×1080</div>
            <div class="cam-tag">大门摄像头 · CAM-01</div>
          </div>
        </div>
      </section>

      <!-- 右侧报警 -->
      <aside class="panel">
        <div class="corner-bl"></div>
        <div class="corner-br"></div>
        <div class="panel-title">报警记录</div>
        <div class="panel-body">
          <div class="alarm-list">
            <div class="alarm-item">
              <div class="alarm-time">12:00</div>
              <div class="alarm-content">
                <div class="alarm-text">识别到未戴安全帽</div>
                <span class="alarm-tag">人员安全</span>
              </div>
            </div>
            <div class="alarm-item">
              <div class="alarm-time">12:05</div>
              <div class="alarm-content">
                <div class="alarm-text">车辆违停</div>
                <span class="alarm-tag">交通违规</span>
              </div>
            </div>
            <div class="alarm-item">
              <div class="alarm-time">12:18</div>
              <div class="alarm-content">
                <div class="alarm-text">周界入侵告警</div>
                <span class="alarm-tag">区域入侵</span>
              </div>
            </div>
            <div class="alarm-item">
              <div class="alarm-time">12:32</div>
              <div class="alarm-content">
                <div class="alarm-text">烟雾浓度异常</div>
                <span class="alarm-tag">消防预警</span>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- 底部统计 -->
    <footer class="stats">
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </div>
        <div>
          <div class="stat-label">今日报警</div>
          <div class="stat-value">15<span class="stat-unit">次</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </div>
        <div>
          <div class="stat-label">在线设备</div>
          <div class="stat-value">120<span class="stat-unit">台</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        </div>
        <div>
          <div class="stat-label">AI准确率</div>
          <div class="stat-value">98<span class="stat-unit">%</span></div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const text =
        now.getFullYear() + "-" +
        pad(now.getMonth() + 1) + "-" +
        pad(now.getDate()) + "  " +
        pad(now.getHours()) + ":" +
        pad(now.getMinutes()) + ":" +
        pad(now.getSeconds());
      document.getElementById("clock").textContent = text;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
